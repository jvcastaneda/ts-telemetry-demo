apiVersion: v1
kind: ConfigMap
metadata:
  name: ts-telemetry-demo-grafana-dashboard
  namespace: ts-telemetry-demo
  labels:
    # kube-prometheus-stack's Grafana runs a sidecar (grafana-sc-dashboard)
    # that watches ALL namespaces for ConfigMaps with this label and loads
    # them automatically -- no manual "Import JSON" step, no admin credentials.
    grafana_dashboard: "1"
data:
  ts-telemetry-demo.json: |
    {
      "title": "ts-telemetry-demo",
      "description": "RED method (Rate/Errors/Duration) dashboard for a small instrumented TypeScript service, plus its Node.js runtime metrics.",
      "editable": true,
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "timezone": "browser",
      "tags": [
        "ts-telemetry-demo",
        "learning"
      ],
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "title": "Request rate by status code",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "description": "rate(http_requests_total[1m]) grouped by status_code \u2014 the 'Rate' leg of RED.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(http_requests_total{namespace=\"ts-telemetry-demo\"}[1m])) by (status_code)",
              "legendFormat": "{{status_code}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Error rate (%)",
          "type": "gauge",
          "gridPos": {
            "h": 8,
            "w": 4,
            "x": 12,
            "y": 0
          },
          "description": "Same thresholds as the TsTelemetryDemoHighErrorRate alert, so the panel and the alert agree.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.1
                  },
                  {
                    "color": "red",
                    "value": 0.2
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(http_requests_total{namespace=\"ts-telemetry-demo\", status_code=~\"5..\"}[5m])) / sum(rate(http_requests_total{namespace=\"ts-telemetry-demo\"}[5m]))"
            }
          ]
        },
        {
          "id": 3,
          "title": "Requests in last 15m",
          "type": "stat",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(increase(http_requests_total{namespace=\"ts-telemetry-demo\"}[15m]))"
            }
          ]
        },
        {
          "id": 4,
          "title": "Latency percentiles (p50 / p95 / p99)",
          "type": "timeseries",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "description": "histogram_quantile() over http_request_duration_seconds_bucket \u2014 the 'Duration' leg of RED.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 5
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{namespace=\"ts-telemetry-demo\"}[5m])) by (le))",
              "legendFormat": "p50"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=\"ts-telemetry-demo\"}[5m])) by (le))",
              "legendFormat": "p95"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{namespace=\"ts-telemetry-demo\"}[5m])) by (le))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 5,
          "title": "Simulated work outcomes",
          "type": "timeseries",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "description": "rate(simulated_work_total[1m]) by outcome \u2014 an app-level metric independent of HTTP status codes.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(simulated_work_total{namespace=\"ts-telemetry-demo\"}[1m])) by (outcome)",
              "legendFormat": "{{outcome}}"
            }
          ]
        },
        {
          "id": 6,
          "title": "Node.js heap usage",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 17
          },
          "description": "Default prom-client process metrics: nodejs_heap_size_used_bytes vs nodejs_heap_size_total_bytes.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "total"
                },
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "dash": [
                        10,
                        10
                      ],
                      "fill": "dash"
                    }
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "nodejs_heap_size_used_bytes{namespace=\"ts-telemetry-demo\"}",
              "legendFormat": "used - {{pod}}"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "nodejs_heap_size_total_bytes{namespace=\"ts-telemetry-demo\"}",
              "legendFormat": "total - {{pod}}"
            }
          ]
        },
        {
          "id": 7,
          "title": "Event loop lag",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 17
          },
          "description": "nodejs_eventloop_lag_seconds \u2014 rises when the event loop is blocked by CPU-bound work.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "nodejs_eventloop_lag_seconds{namespace=\"ts-telemetry-demo\"}",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 8,
          "title": "Scrape target up",
          "type": "state-timeline",
          "gridPos": {
            "h": 6,
            "w": 24,
            "x": 0,
            "y": 25
          },
          "description": "up{job=\"ts-telemetry-demo\"} \u2014 the universal 'can Prometheus even see this thing' panel.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "up{namespace=\"ts-telemetry-demo\", job=\"ts-telemetry-demo\"}",
              "legendFormat": "{{pod}}"
            }
          ]
        }
      ]
    }
